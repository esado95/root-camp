<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz TSSR2601</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@v2.16.0/devicon.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="frame">
  <div class="titlebar">
    <span class="dot red"></span><span class="dot amber"></span><span class="dot green"></span>
    <span class="prompt">said@tssr2601:~$ <span id="tb-path">./quiz --start</span><span class="cursor">▊</span></span>
    <span class="online">● en ligne</span>
  </div>
  <main id="screen"><p class="loading"># chargement de la banque de questions...</p></main>
  <nav class="nav">
    <button data-nav="home" class="active"><i class="ti ti-layout-grid"></i><span>Thèmes</span></button>
    <button data-nav="exam"><i class="ti ti-clock-bolt"></i><span>Examen</span></button>
    <button data-nav="review"><i class="ti ti-flame"></i><span>À revoir</span><em id="rev-count" class="pill" hidden></em></button>
    <button data-nav="profile"><i class="ti ti-user-hexagon"></i><span>Profil</span></button>
  </nav>
</div>
<div id="toast"></div>
<script src="js/app.js"></script>
</body>
</html>
